# Kartik.ai Profile P Production Single-VM Compose Stack (Blueprint v4.3 §3.4, §7.2 Phase 16, Invariants #1 & #14)
# Designed to stay within available free allowances, subject to current eligibility and usage
# (Oracle Cloud Always Free ARM64 VM + Neon Serverless Postgres + Cloudflare R2 $0 egress).
#
# Security & Topology Guarantee:
# - ONLY `frontend` (Nginx Reverse Proxy) binds to host port 80/443.
# - `gateway` (:8000), `auth` (:8001), `chat` (:8002), `agent` (:8003), `billing` (:8004),
#   `redis`, and `qdrant` run exclusively on the internal `kartik_internal` bridge network
#   with zero host port mappings.
# - All inter-service tokens, Neon PostgreSQL URLs, and Firebase Admin credentials fail closed
#   via Compose required-var syntax (`:?`) — zero hardcoded fallback secrets.

name: kartik-prod

services:
  frontend:
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - kartik_internal

  gateway:
    build:
      context: ../../..
      dockerfile: backend/gateway/Dockerfile
    restart: unless-stopped
    secrets:
      - user_context_signing_key
      - user_context_public_key
    environment:
      NODE_ENV: production
      PORT: "8000"
      AUTH_SERVICE_URL: http://auth:8001
      CHAT_SERVICE_URL: http://chat:8002
      AGENT_SERVICE_URL: http://agent:8003
      BILLING_SERVICE_URL: http://billing:8004
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SERVICE_TO_SERVICE_TOKEN: ${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set to a strong secret in production}
      GATEWAY_TO_BILLING_TOKEN: ${GATEWAY_TO_BILLING_TOKEN:-${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set}}
      USER_CONTEXT_SIGNING_KEY_FILE: /run/secrets/user_context_signing_key
      USER_CONTEXT_PUBLIC_KEY_FILE: /run/secrets/user_context_public_key
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      DEMO_READ_ONLY: ${DEMO_READ_ONLY:-false}
    depends_on:
      - auth
      - chat
      - agent
      - billing
      - redis
    networks:
      - kartik_internal

  auth:
    build:
      context: ../../..
      dockerfile: backend/services/auth/Dockerfile
    restart: unless-stopped
    secrets:
      - user_context_public_key
    environment:
      NODE_ENV: production
      PORT: "8001"
      DATABASE_URL: ${AUTH_DATABASE_URL:-${DATABASE_URL:?DATABASE_URL or AUTH_DATABASE_URL must be set to a valid Neon PostgreSQL connection URI}}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}
      DATABASE_SCHEMA: auth
      PGPOOL_IDLE_TIMEOUT_MS: ${PGPOOL_IDLE_TIMEOUT_MS:-10000}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SERVICE_TO_SERVICE_TOKEN: ${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set to a strong secret in production}
      AUTH_PROVIDER_MODE: ${AUTH_PROVIDER_MODE:-firebase}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID must be set for production Firebase authentication}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:?FIREBASE_CLIENT_EMAIL must be set for production Firebase authentication}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:?FIREBASE_PRIVATE_KEY must be set for production Firebase authentication}
      USER_CONTEXT_PUBLIC_KEY_FILE: /run/secrets/user_context_public_key
    depends_on:
      - redis
    networks:
      - kartik_internal

  chat:
    build:
      context: ../../..
      dockerfile: backend/services/chat/Dockerfile
    restart: unless-stopped
    secrets:
      - user_context_public_key
    environment:
      NODE_ENV: production
      PORT: "8002"
      DATABASE_URL: ${CHAT_DATABASE_URL:-${DATABASE_URL:?DATABASE_URL or CHAT_DATABASE_URL must be set to a valid Neon PostgreSQL connection URI}}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}
      DATABASE_SCHEMA: chat
      PGPOOL_IDLE_TIMEOUT_MS: ${PGPOOL_IDLE_TIMEOUT_MS:-10000}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      AGENT_SERVICE_URL: http://agent:8003
      BILLING_SERVICE_URL: http://billing:8004
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SERVICE_TO_SERVICE_TOKEN: ${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set to a strong secret in production}
      CHAT_TO_AGENT_TOKEN: ${CHAT_TO_AGENT_TOKEN:-${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set}}
      CHAT_TO_BILLING_TOKEN: ${CHAT_TO_BILLING_TOKEN:-${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set}}
      USER_CONTEXT_PUBLIC_KEY_FILE: /run/secrets/user_context_public_key
    depends_on:
      - agent
      - billing
      - redis
    networks:
      - kartik_internal

  agent:
    build:
      context: ../../..
      dockerfile: backend/services/agent/Dockerfile
    restart: unless-stopped
    secrets:
      - user_context_public_key
    environment:
      NODE_ENV: production
      PORT: "8003"
      DATABASE_URL: ${AGENT_DATABASE_URL:-${DATABASE_URL:?DATABASE_URL or AGENT_DATABASE_URL must be set to a valid Neon PostgreSQL connection URI}}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}
      DATABASE_SCHEMA: agent
      PGPOOL_IDLE_TIMEOUT_MS: ${PGPOOL_IDLE_TIMEOUT_MS:-10000}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      MOCK_AI: ${MOCK_AI:-false}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-live}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-3.1-flash-lite-image}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-8192}
      OBJECT_STORAGE_MODE: ${OBJECT_STORAGE_MODE:-postgres}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-assets}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-ap-southeast-1}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      INTERNAL_CALLER_TOKEN_CHAT: ${INTERNAL_CALLER_TOKEN_CHAT:-${CHAT_TO_AGENT_TOKEN:-${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set}}}
      USER_CONTEXT_PUBLIC_KEY_FILE: /run/secrets/user_context_public_key
    depends_on:
      - qdrant
      - redis
    networks:
      - kartik_internal

  billing:
    build:
      context: ../../..
      dockerfile: backend/services/billing/Dockerfile
    restart: unless-stopped
    secrets:
      - user_context_public_key
    environment:
      NODE_ENV: production
      PORT: "8004"
      BILLING_DATABASE_URL: ${BILLING_DATABASE_URL:?BILLING_DATABASE_URL must be set to a valid Neon PostgreSQL connection URI}
      DATABASE_URL: ${BILLING_DATABASE_URL:?BILLING_DATABASE_URL must be set to a valid Neon PostgreSQL connection URI}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-}
      DATABASE_SCHEMA: billing
      PGPOOL_IDLE_TIMEOUT_MS: ${PGPOOL_IDLE_TIMEOUT_MS:-10000}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      BILLING_MODE: ${BILLING_MODE:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      INTERNAL_CALLER_TOKEN_CHAT: ${INTERNAL_CALLER_TOKEN_CHAT:-${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set}}
      CHAT_TO_BILLING_TOKEN: ${CHAT_TO_BILLING_TOKEN:-${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set}}
      GATEWAY_TO_BILLING_TOKEN: ${GATEWAY_TO_BILLING_TOKEN:-${SERVICE_TO_SERVICE_TOKEN:?SERVICE_TO_SERVICE_TOKEN must be set}}
      USER_CONTEXT_PUBLIC_KEY_FILE: /run/secrets/user_context_public_key
    depends_on:
      - redis
    networks:
      - kartik_internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - kartik_internal

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - qdrant_prod_data:/qdrant/storage
    networks:
      - kartik_internal

secrets:
  user_context_signing_key:
    file: ${USER_CONTEXT_SIGNING_KEY_PATH:-./secrets/user_context_signing_key.pem}
  user_context_public_key:
    file: ${USER_CONTEXT_PUBLIC_KEY_PATH:-./secrets/user_context_public_key.pem}

networks:
  kartik_internal:
    driver: bridge

volumes:
  qdrant_prod_data:
