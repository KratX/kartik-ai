# Kartik.ai Single-Origin Reverse Proxy — Profile P (Blueprint §2.1, §3.4, §9 Invariant #1).
# Serves the compiled React SPA for all non-API paths and forwards /api/* + health probes
# exclusively to the API Gateway (auth, chat, agent, and billing have no public ports).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cap upload size at the edge (Blueprint §10 & §11)
    client_max_body_size 10m;

    # Hardened edge headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Gateway public routes
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
    }

    # Liveness & readiness probes
    location = /healthz {
        proxy_pass http://gateway:8000/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://gateway:8000/readyz;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
