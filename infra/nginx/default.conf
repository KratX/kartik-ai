# Kartik.ai Single-Origin Reverse Proxy — Profile P (Blueprint §2.1, §3.4, §9 Invariant #1).
# Serves the compiled React SPA for all non-API paths and forwards /api/* + health probes
# exclusively to the API Gateway (auth, chat, agent, and billing have no public ports).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip compression for SPA JS/CSS/JSON/SVG bundles
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cap upload size at the edge (Blueprint §10 & §11)
    client_max_body_size 10m;

    # Hardened edge headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Local Nginx container health probe (independent of upstream gateway readiness)
    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API Gateway public routes (SSE-safe unbuffered proxy)
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass_header Set-Cookie;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # Liveness & readiness probes forwarded to API Gateway
    location = /healthz {
        proxy_pass http://gateway:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://gateway:8000/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Immutable fingerprinted Vite bundle assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Never cache index.html so new deployments activate immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
