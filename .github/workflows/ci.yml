# Kartik.ai CI Pipeline — Blueprint v4.3 §4.6, §4.7, §7.2 (Phase 0), §8.5.
# Enforces single lockfile (pnpm-lock.yaml), Node 26 primary + 24 advisory matrix,
# toolchain preflight, frozen-lockfile install, typecheck, lint, test, and build.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [26, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce single lockfile (Blueprint §4.6 & §8.5)
        run: |
          test ! -f package-lock.json
          test ! -f yarn.lock
          test ! -f bun.lock
          test ! -f bun.lockb

      - name: Setup pnpm (reads packageManager from package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Run toolchain preflight (Blueprint §4.7)
        run: pnpm toolchain

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspaces
        run: pnpm typecheck

      - name: Lint workspaces
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build workspaces
        run: pnpm build
