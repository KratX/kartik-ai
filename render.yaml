# Render Blueprint for Kartik.ai — Multi-Agent AI Workspace
# Deploy from GitHub: https://dashboard.render.com/blueprints
# Region "singapore" sits directly alongside your Neon PostgreSQL DB (ap-southeast-1).

services:
  - type: web
    name: kartik-ai
    runtime: node
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: npm install --include=dev && npm run build && npm run build:workspaces
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOW_ROOT_DEMO_RUNTIME
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: AUTH_PROVIDER_MODE
        value: firebase
      - key: AI_PROVIDER_MODE
        value: live
      - key: MOCK_AI
        value: "false"
      - key: IMAGE_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
      - key: OBJECT_STORAGE_MODE
        value: neon
      - key: BILLING_MODE
        value: razorpay_test
      - key: DATABASE_SCHEMA
        value: chat
      - key: PUBLIC_APP_URL
        value: https://kartik-ai.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://kartik-ai.onrender.com
      # Optional: paste your Google Search Console HTML verification token after deploy
      - key: GOOGLE_SITE_VERIFICATION
        sync: false

      # --- Secrets (entered securely in Render Dashboard — never committed to Git) ---
      - key: DATABASE_URL
        sync: false
      - key: BILLING_DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: kartik_chunks_v1
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: USER_CONTEXT_SIGNING_KEY
        sync: false
      - key: USER_CONTEXT_PUBLIC_KEY
        sync: false
      - key: SESSION_SIGNING_SECRET
        sync: false
      - key: OBJECT_STORAGE_SIGNING_SECRET
        sync: false
